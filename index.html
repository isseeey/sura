/* =========================================================
   helpers: collision
   ========================================================= */
function activeCols(){if(colsDirty){colsCache=COL.slice();for(const k in BAR)if(BAR[k].on)colsCache.push(BAR[k]);colsDirty=false;}return colsCache;}
function ovP(r){return P.x+4>r.x&&P.x-4<r.x+r.w&&P.y>r.y&&P.y-15<r.y+r.h;}
function solidAt(x,y){for(const r of COL)if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)return true;for(const k in BAR){const r=BAR[k];if(r.on&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)return true;}return false;}
function pushOut(o,rad){for(const r of COL){const nx=clamp(o.x,r.x,r.x+r.w),ny=clamp(o.y,r.y,r.y+r.h);const dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);if(d<rad){if(d<0.001){o.y=r.y-rad;}else{o.x=nx+dx/d*rad;o.y=ny+dy/d*rad;}}}}

/* =========================================================
   player
   ========================================================= */
const GRAV=0.2,MAXFALL=4.4,RUNV=1.25,JUMPV=-3.95,AIRV=-3.55;
function doJump(v,air){P.jt=0;P.vy=v;P.ground=false;P.coy=0;P.jb=0;P.sqx=0.72;P.sqy=1.32;P.trailT=air?38:24;if(air){part({kind:'ring',x:P.x,y:P.y-2,life:16,size:1,size2:9,color:'#b77bff'});sparkleBurst(P.x,P.y-2,7);SFX.air();}else{dustFX(P.x,P.y,6);SFX.jump();}}
function hurt(dir){
  if(P.inv>0||state!=='play')return;
  P.hp--;P.inv=80;P.vx=dir*2;P.vy=-2.6;P.lock=10;P.hs=1.45;P.flash=8;shake=7;hitstop=4;hurtFX();SFX.hurt();
  if(P.hp<=0){state='dead';deadT=0;}
}
function updatePlayer(){
  const ctrl=state==='play'&&P.lock<=0;
  if(P.lock>0)P.lock--;
  const ax=ctrl?(K.r-K.l):0;
  const acc=P.ground?0.26:0.17,dec=P.ground?0.32:0.06;
  if(ax){P.vx+=clamp(ax*RUNV-P.vx,-acc,acc);P.face=ax;}else P.vx+=clamp(-P.vx,-dec,dec);
  if(ctrl&&jp){if(P.ground||P.coy>0)doJump(JUMPV,false);else if(P.air>0){P.air--;doJump(AIRV,true);}else P.jb=8;}
  else if(P.jb>0){P.jb--;if(P.ground)doJump(JUMPV,false);}
  P.jt=(P.jt||0)+1;let g=GRAV;if(P.vy<0&&!K.j&&state==='play'&&P.jt>7)g=0.32;
  P.vy=Math.min(P.vy+g,MAXFALL);
  const cols=activeCols();
  P.x+=P.vx;
  for(const r of cols){if(ovP(r)){if(P.vx>0)P.x=r.x-4;else if(P.vx<0)P.x=r.x+r.w+4;else{const pl=(P.x+4)-r.x,pr=(r.x+r.w)-(P.x-4);P.x+=pl<pr?-pl:pr;}P.vx=0;}}
  const prevY=P.y,was=P.ground;P.y+=P.vy;P.ground=false;
  for(const r of cols){if(ovP(r)){if(P.vy>0){P.y=r.y;P.ground=true;}else if(P.vy<0){P.y=r.y+r.h+15;}P.vy=0;}}
  if(P.vy>=0)for(const p of PLATS){if(P.x+3>p.x&&P.x-3<p.x+p.w&&prevY<=p.y+0.01&&P.y>=p.y){P.y=p.y;P.vy=0;P.ground=true;}}
  if(P.ground){P.coy=6;P.air=P.maxAir;if(!was){P.sqx=1.3;P.sqy=0.74;dustFX(P.x,P.y,4);SFX.land();}}else P.coy--;
  if(P.inv>0)P.inv--;if(P.flash>0)P.flash--;
  P.sqx+=(1-P.sqx)*0.2;P.sqy+=(1-P.sqy)*0.2;P.hs+=(1-P.hs)*0.12;
  // animation
  if(!P.ground){P.frame=P.vy<0?FR.jump:FR.fall;P.bob=0;}
  else if(Math.abs(P.vx)>0.3){const pa=Math.floor(P.anim);P.anim+=Math.abs(P.vx)*0.12;const na=Math.floor(P.anim);P.frame=FR.run[na%4];P.bob=(na%2===1)?-1:0;if(na!==pa&&na%2===0)SFX.step();}
  else{P.frame=FR.idle;P.bob=0;P.anim=0;}
  // trail
  if(P.trailT>0||(!P.ground&&Math.abs(P.vy)>1.6)){P.trail.push({x:P.x-P.face*1.5,y:P.y-9,a:1});if(frame%2===0)part({kind:'star',x:P.x+rand(-2,2),y:P.y-8+rand(-3,3),vx:rand(-0.25,0.25),vy:rand(-0.1,0.3),life:rand(25,45),size:rand(0.8,1.5),color:pick(STARCOL),rot:rand(TAU),spin:rand(-0.12,0.12),g:0.008});}
  for(const t of P.trail)t.a*=0.9;
  while(P.trail.length>26||(P.trail.length&&P.trail[0].a<0.04))P.trail.shift();
  if(P.trailT>0)P.trailT--;
  if(P.ground&&Math.abs(P.vx)>0.5&&frame%5===0)part({kind:'star',x:P.x-P.face*4+rand(-1,1),y:P.y-1-rand(2),vx:-P.face*0.15,vy:rand(-0.25,-0.05),life:rand(22,36),size:rand(0.6,1.1),color:pick(STARCOL),rot:rand(TAU),spin:0.1});
  // checkpoints
  for(let i=cp+1;i<CHECKS.length;i++)if(P.x>CHECKS[i].x&&P.ground)cp=i;
}

/* ---------- aiming & throwing ---------- */
function targets(){const a=[];for(const e of ENEMIES)if(e.alive)a.push(e);if(ORB.state==='bubble'&&P.x>430&&P.x<610)a.push(ORB);if(BOSS.alive)a.push(BOSS);return a;}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/4);for(let i=1;i<n;i++){const t=i/n;if(solidAt(x0+(x1-x0)*t,y0+(y1-y0)*t))return false;}return true;}
let atCache=null,atFrame=-1;
function autoTarget(){if(atFrame===frame)return atCache;atFrame=frame;let best=null,bd=1e9;const fight=BOSS.alive;for(const t of targets()){if(fight&&t.kind!=='boss'&&(t.tx<1462||t.tx>1706))continue;const dx=t.tx-P.x,dy=t.ty-(P.y-10),d=Math.hypot(dx,dy);if(d>(t.kind==='boss'?240:150))continue;let sc=d+(dx*P.face<-4?70:0);if(t.kind==='boss')sc-=40;if(sc<bd&&los(P.x,P.y-10,t.tx,t.ty)){bd=sc;best=t;}}return atCache=best;}
function useMouseAim(){return !TOUCH&&mouse.on&&(fireSrc==='mouse'||performance.now()-mouse.t<3000);}
function throwStar(){
  P.cool=9;const ox=P.x+P.face*5,oy=P.y-10;let tx,ty,tgt=null;
  if(useMouseAim()){tx=camIX+mouse.x/S;ty=camIY+mouse.y/S;}
  else{tgt=autoTarget();if(tgt){tx=tgt.tx;ty=tgt.ty;}else{tx=ox+P.face*60;ty=oy-1;}}
  const dx=tx-ox,dy=ty-oy,d=Math.hypot(dx,dy)||1;
  if(dx*P.face<0&&Math.abs(dx)>3)P.face=dx>0?1:-1;
  STARS.push({x:ox,y:oy,vx:dx/d*3.4,vy:dy/d*3.4,life:85,rot:rand(TAU),spin:(dx>=0?1:-1)*0.22,trail:[],tgt});
  sparkleBurst(ox,oy,4,['#ffffff','#e7c8ff'],0.8);SFX.throw();
}
function blast(){
  const bx=P.x,by=P.y-12;
  part({kind:'flash',x:bx,y:by,life:22,size:4,size2:34,color:'#ffffff'});
  part({kind:'ring',x:bx,y:by,life:30,size:4,size2:70,color:'#b77bff'});
  FLARES.push({x:bx,y:by,t:0,dur:34});
  for(let i=0;i<46;i++){const a=rand(TAU),s=rand(1,4.5);part({kind:pick(['star','tw','petal']),x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(30,60),size:rand(0.9,1.8),color:pick(['#ffffff','#d9a8ff','#ff9ad5','#b77bff']),drag:0.93,rot:rand(TAU),spin:rand(-0.2,0.2)});}
  shake=12;hitstop=5;flashA=0.22;flashC='200,160,255';SFX.blast();
  for(const e of ENEMIES)if(e.alive&&Math.hypot(e.tx-bx,e.ty-by)<82)damageEnemy(e,10);
  if(BOSS.alive&&Math.hypot(BOSS.x-bx,BOSS.y-by)<170&&BOSS.lid<0.6)bossHit(10);
  if(ORB.state==='bubble'&&Math.hypot(ORB.x-bx,ORB.y-by)<110){ORB.hp=0;breakBubble();}
}
function damageEnemy(e,dmg){e.hp-=dmg;e.flash=8;if(e.kind==='shadow'){e.recoil=18;}if(e.hp<=0){e.alive=false;deathFX(e.tx,e.ty);SFX.die();shake=Math.max(shake,3);}else SFX.hit();}

/* ---------- orb / bubble ---------- */
function breakBubble(){if(ORB.state!=='bubble')return;ORB.state='free';ORB.alive=false;

  flashA=0.35;flashC='255,240,220';hitstop=6;shake=6;SFX.shatter();}
function absorbOrb(){ORB.state='gone';P.power=true;P.maxAir=3;P.air=3;P.hp=4;BAR.shaft.on=false;colsDirty=true;
  for(let y=BAR.shaft.y;y<BAR.shaft.y+BAR.shaft.h;y+=3)part({kind:pick(['tw','star']),x:BAR.shaft.x+2,y,vx:rand(-0.6,0.6),vy:rand(-0.6,0.2),life:rand(25,50),size:rand(0.8,1.5),color:pick(STARCOL),drag:0.95,rot:rand(TAU)});

  flashA=0.38;flashC='255,248,225';shake=6;SFX.power();}
function updateOrb(){ORB.t++;
  if(ORB.state==='bubble'){ORB.y=ORB.by+Math.sin(ORB.t*0.03)*2.5;ORB.wob*=0.9;ORB.tx=ORB.x;ORB.ty=ORB.y;if(ORB.hitA>0)ORB.hitA--;}
  else if(ORB.state==='free'){ORB.x+=(P.x-ORB.x)*0.05;ORB.y+=(P.y-10-ORB.y)*0.05;if(frame%2===0)part({kind:'tw',x:ORB.x+rand(-4,4),y:ORB.y+rand(-4,4),life:20,size:1.2,color:'#fff3b0'});if(Math.hypot(P.x-ORB.x,P.y-10-ORB.y)<5&&state==='play')absorbOrb();}
}

/* ---------- enemies ---------- */
function updateEnemies(){
  for(const e of ENEMIES){if(!e.alive)continue;e.t++;if(e.flash>0)e.flash--;
    if(e.kind==='shadow'){
      const dx=P.x-e.x,dy=(P.y-8)-e.y,d=Math.hypot(dx,dy)||1;
      if(e.recoil>0){e.recoil--;e.vx*=0.93;e.vy*=0.93;if(e.recoil===17){e.vx=-dx/d*1.3;e.vy=-dy/d*0.6;}}
      else if(state==='play'&&d<86&&Math.abs(dy)<60){e.vx+=dx/d*0.034;e.vy+=dy/d*0.03;const sp=Math.hypot(e.vx,e.vy);if(sp>0.62){e.vx*=0.62/sp;e.vy*=0.62/sp;}}
      else{e.vx+=(e.hx-e.x)*0.0015;e.vy+=(e.hy-e.y)*0.004+Math.sin(e.t*0.05)*0.01;e.vx*=0.96;e.vy*=0.96;}
      e.x+=e.vx;e.y+=e.vy;pushOut(e,15);
      if(e.blink>0)e.blink--;else if(Math.random()<0.004)e.blink=7;
      e.tx=e.x;e.ty=e.y-4;
      if(frame%6===0&&Math.abs(e.x-camX-VW/2)<VW)part({kind:'smoke',x:e.x+rand(-9,9),y:e.y+rand(-8,14),vx:rand(-0.15,0.15),vy:rand(-0.45,-0.15),life:rand(25,45),size:rand(2,4.5),add:false});
      if(state==='play'&&d<11&&e.recoil<=0){hurt(dx>0?1:-1);e.recoil=40;e.vx=-dx/d*1.3;e.vy=-0.4;}
    }else{
      const sway=Math.sin(e.t*0.05)*1.5;e.tx=e.x+sway;e.ty=e.y-17;
      const dx=P.x-e.tx,dy=(P.y-9)-e.ty,d=Math.hypot(dx,dy)||1;e.cd--;
      if(state==='play'&&d<125&&e.cd<=0){e.cd=rand(140,200);REDS.push({x:e.tx,y:e.ty,vx:dx/d*0.95,vy:dy/d*0.95,life:240});part({kind:'ring',x:e.tx,y:e.ty,life:14,size:1,size2:6,color:'#ff3b4a'});}
    }
  }
  for(const r of REDS){r.life--;const dx=P.x-r.x,dy=(P.y-9)-r.y,d=Math.hypot(dx,dy)||1;r.vx+=dx/d*0.012;r.vy+=dy/d*0.012;const sp=Math.hypot(r.vx,r.vy);if(sp>1.1){r.vx*=1.1/sp;r.vy*=1.1/sp;}r.x+=r.vx;r.y+=r.vy;
    if(frame%3===0)part({kind:'px',x:r.x,y:r.y,life:14,size:1,color:'#ff4050'});
    if(state==='play'&&d<6){hurt(dx<0?1:-1);r.life=0;deathFX(r.x,r.y);}
    if(solidAt(r.x,r.y)){r.life=0;part({kind:'ring',x:r.x,y:r.y,life:12,size:1,size2:7,color:'#ff3b4a'});}}
  REDS=REDS.filter(r=>r.life>0);
}

/* ---------- stars ---------- */
function updateStars(){
  for(const s of STARS){s.life--;s.rot+=s.spin;
    if(s.tgt&&s.tgt.alive){const a=Math.atan2(s.tgt.ty-s.y,s.tgt.tx-s.x),c=Math.atan2(s.vy,s.vx);let dd=a-c;dd=Math.atan2(Math.sin(dd),Math.cos(dd));const n=c+clamp(dd,-0.1,0.1),sp=Math.hypot(s.vx,s.vy);s.vx=Math.cos(n)*sp;s.vy=Math.sin(n)*sp;}
    s.x+=s.vx;s.y+=s.vy;s.trail.push({x:s.x,y:s.y});if(s.trail.length>11)s.trail.shift();
    if(frame%3===0)part({kind:pick(['tw','x']),x:s.x+rand(-2,2),y:s.y+rand(-2,2),vx:-s.vx*0.05,vy:-s.vy*0.05,life:rand(14,26),size:rand(0.6,1.1),color:pick(['#ffffff','#d9c2ff','#bfe0ff'])});
    let hit=false;
    for(const e of ENEMIES){if(!e.alive)continue;const rr=e.kind==='shadow'?12:6;if(Math.hypot(s.x-e.tx,s.y-e.ty)<rr){damageEnemy(e,1);impactFX(s.x,s.y);hit=true;break;}}
    if(!hit&&ORB.state==='bubble'&&Math.hypot(s.x-ORB.x,s.y-ORB.y)<17){const a=Math.atan2(s.y-ORB.y,s.x-ORB.x);impactFX(ORB.x+Math.cos(a)*16,ORB.y+Math.sin(a)*16,'#ff7ab0');ORB.hp--;ORB.wob=1;ORB.hitA=10;SFX.bubble();if(ORB.hp<=0)breakBubble();hit=true;}
    if(!hit&&BOSS.alive&&Math.hypot(s.x-BOSS.x,s.y-BOSS.y)<19){if(BOSS.lid>0.55){if(!s.defl){s.defl=true;s.vx*=-0.5;s.vy=-Math.abs(s.vy)*0.5-1;s.tgt=null;s.life=Math.min(s.life,18);sparkleBurst(s.x,s.y,6,['#ffffff','#ffb0d8']);SFX.deflect();}}else{bossHit(1);impactFX(s.x,s.y);hit=true;}}
    if(!hit&&solidAt(s.x,s.y)){sparkleBurst(s.x,s.y,6);part({kind:'ring',x:s.x,y:s.y,life:12,size:1,size2:6,color:'#c9a0ff'});hit=true;}
    if(hit)s.life=0;
  }
  STARS=STARS.filter(s=>s.life>0);
}

/* ---------- boss ---------- */
function startFight(){BOSS.state='intro';BOSS.t=0;BAR.arenaL.on=true;BAR.arenaR.on=true;colsDirty=true;setMusic('boss',true);shake=10;SFX.rumble();P.hp=4;zoomW=120;zoomH=170;applyZoom();snapCam();}
function bossHit(d){BOSS.hp-=d;BOSS.flash=5;SFX.bossHit();if(BOSS.hp<=0){BOSS.hp=0;BOSS.state='dying';BOSS.dieT=0;BOSS.alive=false;WARN=[];BOLTS=[];DRIPS=[];setMusic('end');SFX.bossDie();chargeSnd(false);}}
function boltPath(x){const pts=[];let px=x;for(let y=-342;y<=-110;y+=rand(6,11)){pts.push([px,y]);px=clamp(px+rand(-5,5),x-10,x+10);}pts.push([x,-110]);const br=[];for(let k=0;k<3;k++){const i=(rand(pts.length-3)|0)+1;let [bx,by]=pts[i];const d=rand()<0.5?-1:1;const b=[[bx,by]];for(let j=0;j<4;j++){bx+=d*rand(3,7);by+=rand(4,9);b.push([bx,by]);}br.push(b);}return{pts,br};}
function updateBoss(){
  const B=BOSS;
  if(B.flash>0)B.flash--;
  if(B.state==='sleep'){B.t++;B.y=-212+Math.sin(B.t*0.02)*4;B.lid=1;if(state==='play'&&P.x>1488&&P.y>-200)startFight();return;}
  if(B.state==='intro'){B.t++;B.y=-212+Math.sin(B.t*0.02)*4;B.disp=B.max*clamp(B.t/70,0,1);if(B.t>36)B.lidT=0;B.lid+=clamp(B.lidT-B.lid,-0.08,0.08);if(B.t>=80){B.state='fight';B.alive=true;B.t=0;}return;}
  if(B.state==='fight'){
    B.t++;const ph2=B.hp<B.max*0.5;
    B.x=1580+Math.sin(B.t*0.011)*34;B.y=-212+Math.sin(B.t*0.023)*7;B.tx=B.x;B.ty=B.y;
    B.blinkT--;if(B.blinkT<=0&&B.hold<=0){B.hold=72;B.blinkT=250+rand(90);SFX.blink();}
    if(B.hold>0){B.hold--;B.lidT=1;}else B.lidT=0;
    B.lid+=clamp(B.lidT-B.lid,-0.1,0.1);
    B.lightT--;if(B.lightT<=0&&state==='play'){B.lightT=ph2?98:142;WARN.push({x:clamp(P.x+rand(-4,4),1466,1702),t:0,dur:56});SFX.warn();}
    if(ph2){B.dripT--;if(B.dripT<=0){B.dripT=105;DRIPS.push({x:B.x+rand(4,26),y:B.y+34,vy:0.2});}}
    B.disp+=(B.hp-B.disp)*0.12;
  }

      case'shard':ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(1,S*0.6);ctx.beginPath();ctx.moveTo(x-Math.cos(p.rot)*p.size*S,y-Math.sin(p.rot)*p.size*S);ctx.lineTo(x+Math.cos(p.rot)*p.size*S,y+Math.sin(p.rot)*p.size*S);ctx.stroke();break;
      case'spark':{ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(1,S*0.35);ctx.beginPath();let px_=x,py_=y;ctx.moveTo(px_,py_);for(let i=0;i<3;i++){px_+=rand(-1,1)*p.size*S*0.6;py_-=rand(0.3,1)*p.size*S*0.5;ctx.lineTo(px_,py_);}ctx.stroke();break;}
      case'glyph':{ctx.globalAlpha=a;const sc=1+(1-a)*0.5;ctx.fillStyle='#ff2b3b';for(const r of p.rects)ctx.fillRect(x+r[0]*S*sc,y+r[1]*S*sc,r[2]*S,r[3]*S);glow(wx,wy,12,'255,40,60',0.6*a);ctx.imageSmoothingEnabled=true;break;}
    }}
  ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
  for(const f of FLARES){f.t++;const a=1-f.t/f.dur;const y=sy(f.y),x=sx(f.x);const g=ctx.createLinearGradient(0,0,devW,0);const cxr=clamp(x/devW,0.01,0.99);g.addColorStop(0,'rgba(170,110,255,0)');g.addColorStop(cxr,`rgba(255,255,255,${a})`);g.addColorStop(1,'rgba(170,110,255,0)');ctx.fillStyle=g;ctx.fillRect(0,y-S*0.4,devW,S*0.8);ctx.globalAlpha=a*0.5;ctx.fillRect(0,y-S*2,devW,S*4);ctx.globalAlpha=1;}
  if(FLARES.length)FLARES=FLARES.filter(f=>f.t<f.dur);
  ctx.globalCompositeOperation='source-over';
  if(BOSS.state==='dead'&&(hugReady||state==='hug'||state==='end')){const img=TOUCH?PROMPT_H:PROMPT_E,k=S,x=sx(Math.round(BOY.x-9-img.width/2)),y=sy(BOY.y-42+Math.round(Math.sin(frame*0.05)));ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;ctx.drawImage(tintC0('r',img),x-k*0.6,y,img.width*k,img.height*k);ctx.drawImage(tintC0('b',img),x+k*0.6,y,img.width*k,img.height*k);ctx.globalAlpha=1;glowRect(x,y,img.width*k,img.height*k);ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=false;ctx.drawImage(img,x,y,img.width*k,img.height*k);}
  if(state==='play'){let rx=null,ry=null;if(useMouseAim()){rx=mouse.x;ry=mouse.y;}else{const t=autoTarget();if(t&&(K.f||K.tf||P.hold>0||TOUCH)){rx=sx(t.tx);ry=sy(t.ty);}}
    if(rx!==null){const h=2.2*S;ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=Math.max(1.5,S*0.42);ctx.strokeRect(Math.round(rx-h),Math.round(ry-h),Math.round(h*2),Math.round(h*2));ctx.fillStyle='#fff';ctx.fillRect(Math.round(rx-S*0.25),Math.round(ry-S*0.25),Math.max(1,S*0.5),Math.max(1,S*0.5));}}
}
const TCC=new Map();
function tintC0(k,img){let m=TCC.get(img);if(!m){m={};TCC.set(img,m);}if(!m[k])m[k]=tintC(img,k==='r'?'#ff3060':'#3080ff');return m[k];}
function glowRect(x,y,w,h){const cx_=x+w/2,cy_=y+h/2,R=Math.max(w,h)*0.75;gtex('190,110,255',cx_-R,cy_-R*0.6,R*2,R*1.2,0.6);}

/* =========================================================
   HUD layer (separate sharp canvas, repainted only when it changes)
   ========================================================= */
const bossBarOn=()=>BOSS.state==='intro'||BOSS.state==='fight'||BOSS.state==='dying';
function drawHUDLayer(){
  const showPad=document.body.classList.contains('show');
  let k=state+'|'+hud.width+'x'+hud.height+(showPad?'s':'');
  if(state!=='end')for(const h of HEARTS)k+='|'+h.on+((h.sc*40)|0)+','+((h.burst*30)|0);
  if(bossBarOn()&&state!=='end')k+='|b'+((BOSS.disp*3)|0);
  if(state==='title')k+='|t'+frame;
  if(state==='end')k+='|e'+Math.min(230,endT);
  if(capShown)k+='|c'+capShown+((capA*24)|0);
  if(k===HUDL.key)return;HUDL.key=k;
  const W=hud.width,H=hud.height;
  hx.setTransform(1,0,0,1,0,0);hx.globalAlpha=1;hx.globalCompositeOperation='source-over';hx.clearRect(0,0,W,H);
  if(state==='title'){hx.fillStyle='rgba(2,4,16,0.42)';hx.fillRect(0,0,W,H);const s=Math.min(W,H)*0.34*(1+Math.sin(frame*0.06)*0.04),x=W/2-s/2,y=H*0.45-s/2;hx.globalCompositeOperation='lighter';hx.globalAlpha=0.5;hx.drawImage(glowTex('255,60,120'),W/2-s,H*0.45-s,s*2,s*2);hx.globalAlpha=1;hx.globalCompositeOperation='source-over';drawHeartVec(hx,x,y,s,false);hx.fillStyle='#ffffff';const tx=W/2+s*0.03,ty=H*0.45+s*0.03,ts=s*0.17;hx.beginPath();hx.moveTo(tx-ts*0.7,ty-ts);hx.lineTo(tx+ts,ty);hx.lineTo(tx-ts*0.7,ty+ts);hx.closePath();hx.lineJoin='round';hx.lineWidth=ts*0.35;hx.strokeStyle='#ffffff';hx.stroke();hx.fill();}
  if(state!=='end'){const pad=8*HDPR,x0=safe.l*HDPR+pad,y0=safe.t*HDPR+pad*0.6;hx.imageSmoothingEnabled=true;
    for(let i=0;i<4;i++){const h=HEARTS[i],x=x0+i*HS*0.98,y=y0;
      if(h.on){const s=h.sc;hx.drawImage(HEART_IMG,x+HS*0.6-HEART_IMG.width*s/2,y+HS*0.6-HEART_IMG.height*s/2,HEART_IMG.width*s,HEART_IMG.height*s);}
      if(h.burst>0){const kk=1-h.burst,cx_=x+HS*0.6,cy_=y+HS*0.6,R=HS*(0.6+kk*1.1);hx.globalCompositeOperation='lighter';hx.globalAlpha=h.burst;hx.drawImage(glowTex('200,90,255'),cx_-R,cy_-R,R*2,R*2);hx.strokeStyle='rgb(255,170,240)';hx.lineWidth=Math.max(1,HS*0.04);hx.beginPath();for(let j=0;j<18;j++){const a=j/18*TAU+hash2(j,3),l1=R*0.25,l2=R*(0.55+0.45*hash2(j,7));hx.moveTo(cx_+Math.cos(a)*l1,cy_+Math.sin(a)*l1);hx.lineTo(cx_+Math.cos(a)*l2,cy_+Math.sin(a)*l2);}hx.stroke();hx.globalCompositeOperation='source-over';hx.globalAlpha=h.burst*h.burst;const s=1+kk*0.5;hx.drawImage(HEART_IMG,cx_-HEART_IMG.width*s/2,cy_-HEART_IMG.height*s/2,HEART_IMG.width*s,HEART_IMG.height*s);hx.globalAlpha=1;}}}
  if(bossBarOn()&&state!=='end'){const portrait=H>W,bw=Math.round(portrait?W*0.86:Math.min(W*0.6,900*HDPR)),bh=Math.round(Math.max(9*HDPR,H*0.017)),bx=Math.round((W-bw)/2),by=Math.round(H-safe.b*HDPR-(showPad?(portrait?128:110):30)*HDPR-bh);
    hx.fillStyle='rgba(25,0,6,0.65)';hx.fillRect(bx-2,by-2,bw+4,bh+4);const fw=Math.max(0,bw*BOSS.disp/BOSS.max);const g=hx.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,'#ff4a4a');g.addColorStop(0.45,'#e00c0c');g.addColorStop(1,'#a20000');hx.fillStyle=g;hx.fillRect(bx,by,fw,bh);hx.fillStyle='rgba(255,170,170,0.55)';hx.fillRect(bx,by,fw,Math.max(1,bh*0.18));hx.fillStyle='rgba(120,0,0,0.6)';hx.fillRect(bx+fw-Math.min(fw,bh*0.5),by,Math.min(fw,bh*0.5),bh);}
  if(capShown&&capA>0&&state!=='end'){const k=Math.max(2,Math.round((devW<500?2.6:3)*HDPR)),img=pixelText(CAPS[capShown],Math.floor(W*0.92/k)),y=Math.round(safe.t*HDPR+8*HDPR+HS*1.22);hx.imageSmoothingEnabled=false;hx.globalAlpha=capA;hx.drawImage(img,Math.round((W-img.width*k)/2),y,img.width*k,img.height*k);hx.shadowBlur=0;hx.globalAlpha=1;}
  if(state==='end'&&END_IMG){hx.imageSmoothingEnabled=false;for(const it of END_IMG){const a=clamp((endT-it.t)/80,0,1);if(a<=0)continue;hx.globalAlpha=a;hx.drawImage(it.c,Math.round(it.x),Math.round(it.y));}hx.globalAlpha=1;}
}

/* =========================================================
   main loop: fixed 60 Hz simulation, interpolated rendering
   ========================================================= */
const STEP=1000/60;let last=performance.now(),acc=0,ema=16.7,slowT=0;
function loop(t){requestAnimationFrame(loop);let dt=t-last;last=t;if(dt>120)dt=120;if(dt<0)dt=0;acc+=dt;ema=ema*0.95+dt*0.05;if(state==='play'&&!document.hidden){if(ema>21){if(++slowT>90)lowQ=true;}else if(slowT>0)slowT--;}let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++;}if(n===5)acc=0;alphaI=clamp(acc/STEP,0,1);render();}
resize();resetWorld();
addEventListener('resize',()=>{resize();snapCam();});
requestAnimationFrame(loop);
}
</script>
